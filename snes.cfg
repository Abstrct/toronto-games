# Toronto Games — ld65 memory map (LoROM, 512 KB = 16 banks of 32 KB)

MEMORY {
    ZP:     start = $000000, size = $0100, type = rw, define = yes;
    LORAM:  start = $000100, size = $1E00, type = rw, define = yes;   # stack lives at $1F00-$1FFF
    HIRAM:  start = $7E2000, size = $E000, type = rw, define = yes;
    XRAM:   start = $7F0000, size = $10000, type = rw, define = yes;

    ROM0:   start = $808000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM1:   start = $818000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM2:   start = $828000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM3:   start = $838000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM4:   start = $848000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM5:   start = $858000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM6:   start = $868000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM7:   start = $878000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM8:   start = $888000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROM9:   start = $898000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROMA:   start = $8A8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROMB:   start = $8B8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROMC:   start = $8C8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROMD:   start = $8D8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROME:   start = $8E8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
    ROMF:   start = $8F8000, size = $8000, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    BSS:      load = LORAM, type = bss;
    HIBSS:    load = HIRAM, type = bss, optional = yes;
    XBSS:     load = XRAM,  type = bss, optional = yes;

    # bank $80: boot, engine, shared library, menus
    CODE:     load = ROM0, type = ro;
    RODATA:   load = ROM0, type = ro;
    HEADER:   load = ROM0, type = ro, start = $80FFC0;

    # banks $81-$83: screens and events (code + their tables)
    SCREENS:  load = ROM1, type = ro, optional = yes;
    EVENTS1:  load = ROM2, type = ro, optional = yes;
    EVENTS2:  load = ROM3, type = ro, optional = yes;
    EVENTS3:  load = ROM4, type = ro, optional = yes;

    # banks $85-$8F: graphics, maps, audio
    GFX0:     load = ROM5, type = ro, optional = yes;
    GFX1:     load = ROM6, type = ro, optional = yes;
    GFX2:     load = ROM7, type = ro, optional = yes;
    GFX3:     load = ROM8, type = ro, optional = yes;
    GFX4:     load = ROM9, type = ro, optional = yes;
    GFX5:     load = ROMA, type = ro, optional = yes;
    GFX6:     load = ROMB, type = ro, optional = yes;
    GFX7:     load = ROMC, type = ro, optional = yes;
    GFX8:     load = ROMD, type = ro, optional = yes;
    GFX9:     load = ROME, type = ro, optional = yes;
    AUDIO:    load = ROMF, type = ro, optional = yes;
}
